{% extends "base.html" %}

{% block title %}
Password Generator
{% endblock %}

{% block content %}

<div class="hero">

<h1>Password Generator</h1>

<form action = "/password_generator" method = "POST">
    <label for="password_length">Password Length:</label>

    <input 
        type="number"
        id="password_length"
        name="password_length"
        min="8"
        max="128"
        required
        >
    
    <button type="submit">Generate Password</button>
</form>

{% if generated_password %}
    <h2>Your generated password:</h2>
    <p>{{ generated_password }}</p>
{% endif %}
</div>

{% endblock %}
