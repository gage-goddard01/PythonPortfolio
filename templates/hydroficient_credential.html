<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 150px;
            height: 270px;

            overflow: hidden;

            font-family:
                "Helvetica Neue",
                Helvetica,
                Arial,
                sans-serif;

            background: transparent;
            color: #333;
        }


        .credential-card {
            width: 150px;
            height: 270px;

            display: flex;
            flex-direction: column;

            background: transparent;

            border: 1px solid #dedede;
            border-radius: 4px;

            overflow: hidden;
        }


        /*
         * Everything above the gray footer.
         * flex: 1 makes this area consume exactly the
         * remaining space, keeping the footer flush
         * against the bottom of the 270px card.
         */
        .credential-content {
            flex: 1;
            min-height: 0;

            display: flex;
            flex-direction: column;
            align-items: center;

            /*
             * More space between the top border
             * and the Top Performer image.
             */
            padding: 31px 10px 0;

            text-align: center;
        }


        .credential-image {
            /*
             * Slightly smaller than before.
             * This creates room for spacing that more
             * closely resembles the Credly badge.
             */
            width: 104px;
            height: 104px;

            object-fit: contain;

            /*
             * Larger gap between the image
             * and the credential title.
             */
            margin-bottom: 24px;
        }


        .credential-title {
            width: 100%;

            margin: 0 0 5px;

            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;

            color: #333;

            font-size: 16px;
            font-weight: 400;
            line-height: 1.25;
        }


        .credential-issuer {
            margin: 0;

            color: #777;

            font-size: 13px;
            font-style: italic;
            font-weight: 400;
            line-height: 1.3;
        }


        /*
         * Fixed footer height, matching the visual
         * proportions of the Credly footer.
         */
        .credential-footer {
            width: 100%;
            height: 31px;

            flex: 0 0 31px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0 4px;

            background: #f2f2f2;

            border-top: 1px solid #dedede;
        }


        .credential-footer a {
            color: #888;

            font-size: 9px;
            font-weight: 500;
            line-height: 1;

            letter-spacing: 0.02em;

            text-decoration: none;
            text-transform: uppercase;
        }


        .credential-footer a:hover {
            color: #333;
            text-decoration: underline;
        }
    </style>

</head>


<body>

    <div class="credential-card">

        <div class="credential-content">

            <img
                class="credential-image"
                src="{{ url_for(
                    'static',
                    filename='images/Hydroficient-top-performer.png'
                ) }}"
                alt="Extern Top Performer">

            <p class="credential-title">
                Hydroficient IoT Cyber Defense
            </p>

            <p class="credential-issuer">
                Issuer: Extern
            </p>

        </div>


        <div class="credential-footer">

            <a
                href="{{ url_for(
                    'static',
                    filename='documents/Hydroficient_Extern_Certificate.pdf'
                ) }}"
                target="_blank"
                rel="noopener noreferrer"
            >
                View Certificate
            </a>

        </div>

    </div>

</body>

</html>
